  <style>
    :root {
      --gold-primary: #C59B27;
      --gold-light: #E6C667;
      --gold-dark: #9A7414;
      --gold-soft: #FBF6E9;
      --dark-bg: #1E1B18;
      --dark-card: #2A2622;
      --bg-body: #F6F5F2;
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --green: #10B981;
      --green-soft: #ECFDF5;
      --red: #EF4444;
      --red-soft: #FEF2F2;
      --border: #EAE6DF;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      padding-bottom: 95px;
    }

    /* TOP APP HEADER */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--dark-bg);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      border: 1.5px solid var(--gold-light);
      background: white;
    }
    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.3px;
      background: linear-gradient(135deg, #F5E1A4, #D4AF37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-sub {
      font-size: 11px;
      color: #A8A29E;
      display: block;
    }
    .badge-gold {
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-light);
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 18px 16px;
    }
    .page { display: none; animation: fadeIn 0.2s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
    }
    .page-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      color: var(--dark-bg);
    }

    /* CARDS & STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      padding: 16px 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      text-align: center;
    }
    .stat-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--gold-soft);
      color: var(--gold-dark);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 8px;
    }
    .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .stat-val { font-size: 22px; font-weight: 800; color: var(--dark-bg); margin-top: 4px; }

    /* HERO BANNER DASHBOARD */
    .hero-card {
      background: linear-gradient(135deg, #26221E 0%, #171512 100%);
      color: white;
      padding: 22px;
      border-radius: 20px;
      margin-bottom: 18px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      position: relative;
      overflow: hidden;
    }
